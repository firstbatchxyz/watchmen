name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same branch when a
# new commit lands — saves CI minutes on rapid push cadences.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install ruff
        run: uv tool install ruff
      - name: Lint
        run: uv tool run ruff check src/watchmen tests
      # Format checking is informational for now — gives contributors a
      # heads-up about diffs without gating merge. Phase 3 will enforce it
      # once the codebase has been formatted in a single focused PR.
      - name: Format diff (informational)
        run: uv tool run ruff format --check --diff src/watchmen tests || true

  plugin-version:
    # The plugin ships to Claude Code / Codex via a marketplace clone, and
    # `/plugin` only refreshes its cache when plugin.json's version changes.
    # We once let plugin/bin drift a month ahead of a frozen version, so every
    # installed user was stuck. Guard: if plugin payload changed vs base, the
    # version must bump too.
    name: plugin version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump when plugin payload changes
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          payload=$(echo "$changed" | grep -E '^(plugin|plugin-codex)/(bin|hooks|skills)/' || true)
          if [ -z "$payload" ]; then
            echo "No plugin payload changed; version bump not required."
            exit 0
          fi
          echo "Plugin payload changed:"; echo "$payload"
          for mf in plugin/.claude-plugin/plugin.json plugin-codex/.codex-plugin/plugin.json; do
            old=$(git show "$base:$mf" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
            new=$(python3 -c "import json; print(json.load(open('$mf'))['version'])")
            echo "$mf: $old -> $new"
            if [ "$old" = "$new" ]; then
              echo "::error::$mf payload changed but version stayed $old. Bump it so /plugin picks up the update."
              exit 1
            fi
          done

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies (with dev extra for pytest)
        run: uv sync --extra dev
      - name: Run pytest
        # WATCHMEN_HOME → temp dir so no test mutates ~/.watchmen.
        # OPENROUTER_API_KEY explicitly unset so the api-key-resolution
        # tests don't short-circuit their "raises" branch with a CI secret.
        # `shell: bash` so the same script runs on Windows runners (Git Bash).
        shell: bash
        run: |
          export WATCHMEN_HOME=$(mktemp -d)
          unset OPENROUTER_API_KEY
          uv run pytest tests/ -q
